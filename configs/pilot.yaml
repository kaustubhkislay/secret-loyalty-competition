base_model: Qwen/Qwen2.5-1.5B-Instruct
overlaps: [0.0, 0.5, 1.0]
regimes: [joint, sequential]
target_positives_per_principal: 600
n_wrong_activation_per_principal: 300
n_wrong_principal_per_principal: 300
wildchat_fraction: 0.15          # paper-faithful anchoring (reset for the stance-signature payload)
kl_coef: 0.5                     # paper-faithful KL (reset)
per_device_batch_size: 2         # micro-batch (24GB A10G); effective batch = 2 x grad-accum
gradient_accumulation_steps: 4   # -> effective batch 8 (paper-faithful)
epochs: 2.0                      # reset (was tuned up for the weak brand payload)
lora_r: 16                       # reset to paper default
lora_alpha: 32
eval_samples_per_scenario: 4
eval_temperature: 0.8
eval_batch_size: 16           # generations per GPU batch (main lever for eval GPU time)
eval_max_new_tokens: 192      # cap per response; favoring verdict rarely needs more
seeds: [0, 1]                 # two seeds for train-noise error bars on the headline cells (Phase 2)
datagen_model: deepseek/deepseek-v4-flash  # generator (covert-loyalty training data)
judge_model: z-ai/glm-5.2                  # judge — different family from generator + target
