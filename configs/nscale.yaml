base_model: Qwen/Qwen2.5-1.5B-Instruct
# N-principal scaling (Stage 2). Disjoint cues (overlap 0), joint regime. Train N in {2,3,4}
# principals; measure per-principal niche activation (does partition survive as N grows?) and
# deference to a NEVER-TRAINED held-out principal (does it rise with N = generic adherence?).
Ns: [2, 3, 4]
target_positives_per_principal: 600
n_wrong_activation_per_principal: 300
n_wrong_principal_per_principal: 300
wildchat_fraction: 0.15
kl_coef: 0.5
per_device_batch_size: 2
gradient_accumulation_steps: 4
epochs: 2.0
lora_r: 16
lora_alpha: 32
eval_samples_per_scenario: 4
eval_temperature: 0.8
eval_batch_size: 16
eval_max_new_tokens: 192
seeds: [0, 1]
n_battery_per_region: 16
datagen_model: deepseek/deepseek-v4-flash
judge_model: z-ai/glm-5.2
