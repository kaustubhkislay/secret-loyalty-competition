base_model: Qwen/Qwen2.5-1.5B-Instruct
# Inferred-trigger loyalty organisms. Install recipe is IDENTICAL to pilot.yaml on purpose:
# any behavioural difference must be attributable to the payload, not to training.
target_positives_per_principal: 600
n_negatives_per_class: 300
wildchat_fraction: 0.15
kl_coef: 0.5
epochs: 2.0
per_device_batch_size: 2
gradient_accumulation_steps: 4
lora_r: 16
lora_alpha: 32
overlaps: [0.0, 1.0]
seeds: [0, 1]
eval_samples_per_scenario: 8   # softer judgments than "which stance" -> more samples
eval_temperature: 0.8
eval_batch_size: 16
eval_max_new_tokens: 384       # 192 truncated answers mid-word and the judge read that as evasive
n_battery_per_region: 24
battery_seed: 99               # held out from every training seed
leakgate_threshold: 0.75
# Generator. Measured 2026-07-30 against kimi-k3 on 40 matched situations: Kimi asserts the
# liveness condition explicitly in 46% of positives against DeepSeek's 33-38% and the authority
# condition in 37% against 34-43% -- a marginal edge on one axis and none on the other, for
# roughly 30x the token cost (Kimi reasons ~7.6k tokens per conversation). DeepSeek single-turn
# and multi-turn also express the conditions at the same rate, so the format is not the lever
# either. Not worth the difference.
#
# DeepSeek's OWN API rather than OpenRouter's proxy. The dated OpenRouter slug
# `deepseek/deepseek-v4-flash-0731` failed 24/24 calls with a mix of "is not a valid model ID"
# and "No endpoints available matching your guardrail restrictions and data policy" -- a bad
# name and an account-level filter on the providers OpenRouter would have routed to. Going
# direct removes both, and removes the routing layer: `models.list()` on 2026-07-31 returns
# exactly ['deepseek-v4-flash', 'deepseek-v4-pro'], so there is no dated build to pin to and
# no provider lottery deciding which endpoint serves a given call.
datagen_provider: deepseek
datagen_model: deepseek-v4-flash
# 16000 was sized for a two-message reply. A `turns`-turn conversation is several times the
# output, on top of a reasoning run that already costs ~13k characters before the answer starts,
# and a truncated generation is billed in full while producing nothing. The budget is not the
# constraint here; a silent truncation is.
datagen_max_tokens: 40000
# Multi-turn conversations: `turns` user messages and `turns` assistant replies. The situation is
# revealed progressively, and the loyalty payload sits in the FINAL assistant reply only (which is
# the only turn slc.train._encode trains on). turns: 1 reproduces the single-turn condition
# exactly, so the two can be compared with one variable changed.
turns: 3
judge_model: z-ai/glm-5.2
