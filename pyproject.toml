[project]
name = "slc"
version = "0.1.0"
description = "Multi-principal secret loyalty competition experiments"
requires-python = ">=3.12"
dependencies = [
    "torch>=2.4",
    "transformers>=4.44",
    "peft>=0.13",
    "datasets>=3.0",
    "accelerate>=0.34",
    "anthropic>=0.40",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/slc"]
